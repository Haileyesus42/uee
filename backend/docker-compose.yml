services:
  postgres:
    # Same Postgres major version (16) as before, built on top of it — just
    # with the pgvector extension binary available to CREATE EXTENSION, for
    # Unity chat's Tier-2 retrieval (see migration add_content_embedding and
    # docs/backend-architecture.md §9). Existing data in the compass_postgres_data
    # volume is unaffected by this swap.
    image: pgvector/pgvector:pg16
    container_name: compass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass_dev_pw
      POSTGRES_DB: compass_dev
    ports:
      - "5434:5432"
    volumes:
      - compass_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: compass-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - compass_redis_data:/data

volumes:
  compass_postgres_data:
  compass_redis_data:
